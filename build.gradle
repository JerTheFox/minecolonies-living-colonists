plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'LDTTeam'
        url = 'https://ldtteam.jfrog.io/ldtteam/modding/'
        content { includeGroup 'com.ldtteam' }
    }
}

// Local secrets for the dev runs: KEY=VALUE lines from .env (see .env.example).
var dotEnv = providers.fileContents(layout.projectDirectory.file('.env')).asText.map { text ->
    text.readLines()
            .collect { it.trim() }
            .findAll { it && !it.startsWith('#') && it.contains('=') }
            .collectEntries { line ->
                var i = line.indexOf('=')
                [(line.substring(0, i).trim()): line.substring(i + 1).trim()]
            }
}.orElse([:])

// Dev-only code for live runs in a real world (#64): loaded by runClient and runServer, never in the built jar.
sourceSets {
    dev {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    devImplementation.extendsFrom implementation
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            // A live run joins the local dev server on its own (#64).
            if (project.hasProperty('liveRun')) {
                programArguments.addAll('--quickPlayMultiplayer', 'localhost:25565')
            }
        }

        server {
            server()
            programArgument '--nogui'
            // Its own folder, so a live run doesn't share the world and settings with runClient.
            gameDirectory = project.file('run-server')
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            environment.putAll(dotEnv)
            // -PliveRun=<name> picks a scripted live run (src/dev, LiveRuns).
            if (project.hasProperty('liveRun')) {
                systemProperty 'livingcolonists.liveRun', project.property('liveRun').toString()
            }
        }
    }

    addModdingDependenciesTo(sourceSets.dev)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.dev)
        }
    }

    // Tests can use Minecraft and MineColonies classes, with stand-ins (Mockito) for colonists and colonies.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// localRuntime: mods needed only to run the dev environment; they do not
// become dependencies of the built jar.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    testRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Transitive dependencies are off: ldtteam POMs pull in older Structurize
    // and BlockUI, JEI and build tooling. The set is declared explicitly.
    implementation("com.ldtteam:minecolonies:${minecolonies_version}") { transitive = false }
    localRuntime("com.ldtteam:structurize:${structurize_version}") { transitive = false }
    localRuntime("com.ldtteam:blockui:${blockui_version}") { transitive = false }
    localRuntime("com.ldtteam:domum-ornamentum:${domum_ornamentum_version}:main") { transitive = false }

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

tasks.named('test', Test) {
    // Long simulations (a week of colony life) run apart: ./gradlew slowTest.
    useJUnitPlatform {
        excludeTags 'slow'
    }
}

tasks.register('slowTest', Test) {
    description = 'Runs the long simulations tagged slow.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'slow'
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            minecolonies_version   : minecolonies_version,
            minecolonies_range     : minecolonies_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
